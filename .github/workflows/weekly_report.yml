name: Weekly Strategy Report

on:
  workflow_run:
    workflows: ["Daily KPI Alert"]
    types:
      - completed
  workflow_dispatch:

env:
  TZ: Asia/Tokyo

jobs:
  check_schedule:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check Day of Week (JST)
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger detected. Proceeding with weekly report."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            DAY_OF_WEEK=$(TZ=Asia/Tokyo date +%u)
            if [ "$DAY_OF_WEEK" -eq 1 ]; then
              echo "Today is Monday in JST. Proceeding with weekly report."
              echo "should_run=true" >> "$GITHUB_OUTPUT"
            else
              echo "Today is not Monday in JST (Day of week: $DAY_OF_WEEK). Skipping weekly report."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  report:
    needs: check_schedule
    if: needs.check_schedule.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Create Service Account Key
        shell: python
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          import os
          key = os.environ['GCP_SERVICE_ACCOUNT_KEY']
          with open('gcp-key.json', 'w') as f:
              f.write(key)
        
      - name: Run Weekly Report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_DATASET_ID: ${{ secrets.GCP_DATASET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: gcp-key.json
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
        run: python -m src.main_weekly
